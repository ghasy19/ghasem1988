<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت سفارش | طراح شو</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .form-container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 5px; margin-top: 20px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #219150; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #3498db; text-decoration: none; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>ثبت سفارش طراحی</h2>
    <form id="orderForm">
        <label for="name">نام و نام خانوادگی:</label>
        <input type="text" id="name" required placeholder="نام شما">

        <label for="type">نوع سفارش:</label>
        <select id="type">
            <option value="portrait">طراحی چهره</option>
            <option value="landscape">طراحی منظره</option>
            <option value="other">سایر</option>
        </select>

        <label for="desc">توضیحات سفارش:</label>
        <textarea id="desc" rows="4" placeholder="جزئیات طرح مورد نظرتان را بنویسید..."></textarea>

        <button type="submit">ثبت سفارش و پرداخت</button>
    </form>
    <a href="index.html" class="back-link">بازگشت به صفحه اصلی</a>
</div>

<script>
    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('سفارش شما با موفقیت ثبت شد! به زودی برای پرداخت با شما تماس می‌گیریم.');
    });
</script>

</body>
</html>
